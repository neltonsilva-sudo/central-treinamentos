<script type="module">
/* Estúdio fotográfico 3D: renderiza cada equipamento com fundo transparente para os cards.
   uso: studio.html?item=lock|lux|gas|laptop|panel|dose&s=1200   → window.__png (dataURL) quando window.__done */
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const Q = new URLSearchParams(location.search);
const ITEM = Q.get('item') || 'lock';
const SIZE = +(Q.get('s') || 1200);
const FONT = '-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(SIZE, SIZE); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = +(Q.get('exp') || 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.85;
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-4, 7, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 10; key.shadow.blurSamples = 24; key.shadow.bias = -0.0004;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xffffff, 1.4); rim.position.set(5, 4, -6); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(6, 1, 4); scene.add(fill);

/* ---------- utilidades ---------- */
function mesh(geo, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m); return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; return t;
}
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function tubeAlong(points, radius, mat, parent, seg = 200) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  return mesh(new THREE.TubeGeometry(curve, seg, radius, 32, false), mat, 0, 0, 0, parent);
}
// dígitos de 7 segmentos (LCD)
const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg' };
function seg7(ctx, ch, x, y, w, h, t, on, off) {
  const sk = w * 0.12; // inclinação
  const P = (px, py) => [x + px + (1 - py / h) * sk, y + py];
  const segs = {
    a: [[t, 0], [w - t, 0], [w - t * 1.6, t], [t * 1.6, t]],
    d: [[t * 1.6, h - t], [w - t * 1.6, h - t], [w - t, h], [t, h]],
    g: [[t, h / 2], [t * 1.6, h / 2 - t / 2], [w - t * 1.6, h / 2 - t / 2], [w - t, h / 2], [w - t * 1.6, h / 2 + t / 2], [t * 1.6, h / 2 + t / 2]],
    f: [[0, t], [t, t * 1.6], [t, h / 2 - t * 0.7], [0, h / 2 - t * 0.2]],
    b: [[w, t], [w, h / 2 - t * 0.2], [w - t, h / 2 - t * 0.7], [w - t, t * 1.6]],
    e: [[0, h / 2 + t * 0.2], [t, h / 2 + t * 0.7], [t, h - t * 1.6], [0, h - t]],
    c: [[w, h / 2 + t * 0.2], [w, h - t], [w - t, h - t * 1.6], [w - t, h / 2 + t * 0.7]],
  };
  const lit = SEG[ch] || '';
  for (const k of 'abcdefg') {
    ctx.fillStyle = lit.includes(k) ? on : off;
    ctx.beginPath(); segs[k].forEach(([px, py], i) => { const [X, Y] = P(px, py); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); ctx.fill();
  }
}
const loadImg = (src) => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });

/* ---------- cadeado de bloqueio com etiqueta (LOTO) ---------- */
async function buildLock() {
  const g = new THREE.Group();
  const red = new THREE.MeshPhysicalMaterial({ color: 0xc8101a, roughness: 0.36, clearcoat: 0.7, clearcoatRoughness: 0.22, sheen: 0.2, sheenColor: 0xff6a6a });
  const chrome = new THREE.MeshPhysicalMaterial({ color: 0xeef1f4, metalness: 1, roughness: 0.14 });
  const brass = new THREE.MeshPhysicalMaterial({ color: 0xd2a948, metalness: 1, roughness: 0.28 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });

  mesh(new RoundedBoxGeometry(4.2, 4.8, 2.1, 10, 0.55), red, 0, 0, 0, g);
  // alça de aço
  const r = 1.3, b = 1.9, top = 3.9, pts = [];
  for (let y = b; y < top; y += 0.15) pts.push(new THREE.Vector3(-r, y, 0));
  for (let k = 0; k <= 36; k++) { const a = Math.PI - k * Math.PI / 36; pts.push(new THREE.Vector3(Math.cos(a) * r, top + Math.sin(a) * r, 0)); }
  for (let y = top - 0.15; y >= b; y -= 0.15) pts.push(new THREE.Vector3(r, y, 0));
  tubeAlong(pts, 0.3, chrome, g);
  // etiqueta impressa no corpo
  const label = canvasTex(640, 440, (c, w, h) => {
    rr(c, 0, 0, w, h, 40); c.fillStyle = '#fff'; c.fill();
    c.save(); c.clip(); c.fillStyle = '#111'; c.fillRect(0, 0, w, 120); c.restore();
    c.fillStyle = '#fff'; c.font = `800 72px ${FONT}`; c.textAlign = 'center'; c.fillText('PERIGO', w / 2, 86);
    c.fillStyle = '#c8101a'; c.font = `900 84px ${FONT}`; c.fillText('BLOQUEADO', w / 2, 230);
    c.fillStyle = '#222'; c.font = `600 40px ${FONT}`; c.fillText('Não remova este cadeado', w / 2, 300);
    c.strokeStyle = '#9aa'; c.lineWidth = 4; c.beginPath(); c.moveTo(60, 392); c.lineTo(w - 60, 392); c.stroke();
    c.fillStyle = '#555'; c.font = `600 34px ${FONT}`; c.textAlign = 'left'; c.fillText('Nome:', 60, 380);
  });
  const lab = mesh(new THREE.PlaneGeometry(3.3, 2.27), new THREE.MeshPhysicalMaterial({ map: label, roughness: 0.3, clearcoat: 0.5, transparent: true, alphaTest: 0.5 }), 0, 0.75, 1.056, g);
  lab.castShadow = false;
  // cilindro da chave
  const cyl = mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.14, 40), brass, 0, -1.45, 1.03, g); cyl.rotation.x = Math.PI / 2;
  mesh(new THREE.BoxGeometry(0.12, 0.5, 0.05), dark, 0, -1.45, 1.11, g);

  // etiqueta de perigo pendurada na alça
  const tagTex = canvasTex(680, 1240, (c, w, h) => {
    rr(c, 0, 0, w, h, 46); c.fillStyle = '#fbfbf8'; c.fill();
    c.save(); c.clip();
    c.fillStyle = '#d3121c'; c.fillRect(0, 0, w, 330);
    c.restore();
    c.globalCompositeOperation = 'destination-out'; c.beginPath(); c.arc(w / 2, 92, 46, 0, Math.PI * 2); c.fill(); c.globalCompositeOperation = 'source-over';
    c.fillStyle = '#fff'; c.textAlign = 'center'; c.font = `900 124px ${FONT}`; c.fillText('PERIGO', w / 2, 270);
    c.fillStyle = '#111'; c.font = `900 118px ${FONT}`; c.fillText('NÃO', w / 2, 500); c.fillText('OPERE', w / 2, 630);
    c.fillStyle = '#333'; c.font = `700 44px ${FONT}`; c.fillText('EQUIPAMENTO', w / 2, 730); c.fillText('BLOQUEADO', w / 2, 784);
    c.textAlign = 'left'; c.font = `600 40px ${FONT}`; c.fillStyle = '#555'; c.strokeStyle = '#999'; c.lineWidth = 3;
    [['Nome:', 900], ['Setor:', 990], ['Data:', 1080]].forEach(([t, y]) => { c.fillText(t, 60, y); c.beginPath(); c.moveTo(190, y + 6); c.lineTo(w - 60, y + 6); c.stroke(); });
    c.fillStyle = '#c62828'; c.fillRect(46, 1150, w - 92, 16);
  });
  const tagMats = Array(6).fill(new THREE.MeshStandardMaterial({ color: 0xeeeeea, roughness: 0.6 }));
  const front = new THREE.MeshStandardMaterial({ map: tagTex, roughness: 0.55, transparent: true, alphaTest: 0.5, side: THREE.DoubleSide });
  const tagPivot = new THREE.Group(); tagPivot.position.set(-r, 3.05, 0); g.add(tagPivot);
  const tag = new THREE.Group(); tagPivot.add(tag);
  const plate = mesh(new THREE.PlaneGeometry(3.4, 6.2), front, 0, -2.75, 0, tag);
  void tagMats;
  const grom = mesh(new THREE.TorusGeometry(0.27, 0.07, 16, 40), brass, 0, 0, 0.01, tag);
  tagPivot.rotation.set(-0.16, 0.12, 0.78);
  tagPivot.position.set(-r, 2.95, 1.3);
  // abraçadeira de nylon prendendo a etiqueta na alça
  const tie = mesh(new THREE.TorusGeometry(0.72, 0.075, 12, 48), new THREE.MeshPhysicalMaterial({ color: 0x15171a, roughness: 0.4, clearcoat: 0.4 }), -r, 3.0, 0.62, g);
  tie.rotation.y = Math.PI / 2; tie.scale.set(1, 0.55, 1);
  tag.position.z = 0.0;
  plate.position.z = 0.0;
  void grom;
  g.rotation.y = -0.22;
  return { root: g, dir: [0.12, 0.2, 1], fov: 22, margin: 1.0 };
}

/* ---------- luxímetro digital com fotocélula ---------- */
async function buildLux() {
  const g = new THREE.Group();
  const boot = new THREE.MeshPhysicalMaterial({ color: 0x2b3036, roughness: 0.78, sheen: 0.4, sheenRoughness: 0.6, sheenColor: 0x5a6068 });
  const black = new THREE.MeshPhysicalMaterial({ color: 0x141619, roughness: 0.32, clearcoat: 0.6 });
  const chrome = new THREE.MeshPhysicalMaterial({ color: 0xe6e9ec, metalness: 1, roughness: 0.18 });
  const W = 5.6, H = 12.4, CW = 560, CH = 1240;
  const face = canvasTex(CW, CH, (c, w, h) => {
    c.fillStyle = '#1d2024'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#f2b72e'; c.fillRect(0, 0, w, 12);
    c.fillStyle = '#d7dbe0'; c.textAlign = 'center'; c.font = `700 30px ${FONT}`; c.fillText('LUXÍMETRO DIGITAL', w / 2, 70);
    // janela do LCD
    rr(c, 40, 100, w - 80, 400, 22); c.fillStyle = '#0d0f12'; c.fill();
    const lg = c.createLinearGradient(0, 120, 0, 480); lg.addColorStop(0, '#cfdcbc'); lg.addColorStop(1, '#aebd97');
    rr(c, 62, 122, w - 124, 356, 12); c.fillStyle = lg; c.fill();
    const on = '#17200f', off = 'rgba(23,32,15,0.06)';
    ['2', '0', '3'].forEach((d, i) => seg7(c, d, 92 + i * 118, 190, 92, 190, 18, on, off));
    c.fillStyle = on; c.font = `800 44px ${FONT}`; c.textAlign = 'left'; c.fillText('lx', 448, 372);
    c.font = `800 26px ${FONT}`; c.fillText('LUX', 86, 166); c.fillStyle = 'rgba(23,32,15,0.08)'; c.fillText('HOLD', 330, 166);
    c.fillStyle = on; for (let k = 0; k < 22; k++) { c.fillStyle = k < 14 ? on : 'rgba(23,32,15,0.08)'; c.fillRect(86 + k * 17, 420, 11, 30); }
    // rótulos das teclas
    c.fillStyle = '#c4c9cf'; c.font = `700 28px ${FONT}`; c.textAlign = 'center';
    [['LUX/FC', 160, 700], ['HOLD', 400, 700], ['MAX/MIN', 160, 880], ['RANGE', 400, 880]].forEach(([t, x, y]) => c.fillText(t, x, y));
    c.strokeStyle = '#c4c9cf'; c.lineWidth = 6; c.beginPath(); c.arc(w / 2, 1060, 26, -Math.PI * 0.32, Math.PI * 1.32); c.stroke();
    c.beginPath(); c.moveTo(w / 2, 1024); c.lineTo(w / 2, 1060); c.stroke();
  });
  mesh(new RoundedBoxGeometry(6.7, 13.7, 2.8, 10, 1.05), boot, 0, 0, 0, g);
  mesh(new RoundedBoxGeometry(W + 0.1, H + 0.1, 0.3, 6, 0.12), black, 0, 0, 1.32, g);
  mesh(new THREE.PlaneGeometry(W, H), new THREE.MeshPhysicalMaterial({ map: face, roughness: 0.5, clearcoat: 0.3 }), 0, 0, 1.475, g);
  const cx = (x) => (x / CW - 0.5) * W, cy = (y) => (0.5 - y / CH) * H;
  // vidro sobre o LCD
  mesh(new THREE.PlaneGeometry(cx(CW - 40) - cx(40), cy(100) - cy(500)), new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.03, transparent: true, opacity: 0.14, clearcoat: 1 }), 0, (cy(100) + cy(500)) / 2, 1.49, g).castShadow = false;
  const keyMat = new THREE.MeshPhysicalMaterial({ color: 0x4b525b, roughness: 0.55 });
  const yel = new THREE.MeshPhysicalMaterial({ color: 0xf2b72e, roughness: 0.45, clearcoat: 0.3 });
  [[160, 640], [400, 640], [160, 820], [400, 820]].forEach(([x, y], i) => mesh(new RoundedBoxGeometry(1.7, 0.75, 0.4, 4, 0.18), i === 0 ? yel : keyMat, cx(x), cy(y), 1.55, g));
  const pw = mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.3, 40), new THREE.MeshPhysicalMaterial({ color: 0xd8473a, roughness: 0.45 }), cx(CW / 2), cy(980), 1.6, g); pw.rotation.x = Math.PI / 2;
  // conector no topo
  const con = mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.8, 24), chrome, 1.6, 7.1, 0, g);
  // fotocélula
  const s = new THREE.Group(); s.position.set(5.6, 9.2, -0.6); s.rotation.set(0.62, 0, -0.18); g.add(s);
  mesh(new THREE.CylinderGeometry(2.25, 2.4, 1.5, 64), black, 0, 0, 0, s);
  const ring = mesh(new THREE.TorusGeometry(2.0, 0.14, 20, 80), chrome, 0, 0.78, 0, s); ring.rotation.x = Math.PI / 2;
  const dome = mesh(new THREE.SphereGeometry(1.86, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshPhysicalMaterial({ color: 0xfdfdfd, roughness: 0.42, sheen: 0.5, sheenColor: 0xffffff, transmission: 0.15, thickness: 0.5 }), 0, 0.75, 0, s);
  dome.scale.y = 0.42;
  const gland = mesh(new THREE.CylinderGeometry(0.35, 0.42, 0.9, 20), black, 0, -0.4, 2.45, s); gland.rotation.x = Math.PI / 2;
  // cabo espiralado do conector à fotocélula
  s.updateMatrixWorld(true); g.updateMatrixWorld(true);
  const a = new THREE.Vector3(1.6, 7.5, 0), bEnd = gland.localToWorld(new THREE.Vector3(0, -0.5, 0));
  const pts = [];
  for (let k = 0; k <= 160; k++) {
    const t = k / 160; const p = new THREE.Vector3().lerpVectors(a, bEnd, t);
    p.y += Math.sin(t * Math.PI) * 3.2;            // arco
    const coil = Math.sin(t * Math.PI) * 0.55;     // espiral só no meio
    p.x += Math.cos(t * Math.PI * 22) * coil; p.z += Math.sin(t * Math.PI * 22) * coil;
    pts.push(p);
  }
  tubeAlong(pts, 0.17, black, g, 900);
  void con;
  g.rotation.set(0, -0.32, -0.1);
  return { root: g, dir: [0.12, 0.2, 1], fov: 22, margin: 1.02 };
}

/* ---------- detector multigás (modelo do gêmeo digital) ---------- */
async function buildGas() {
  const { createLCD } = await import('./gas/lcd.js');
  const { buildDevice } = await import('./gas/device.js');
  const { createFirmware } = await import('./gas/firmware.js');
  const lcd = createLCD();
  const device = buildDevice({ lcdTexture: lcd.texture });
  const fw = createFirmware({ seed: 7 });
  fw.jump('run');
  let out, t = 0;
  for (let i = 0; i < 120; i++) { t += 0.1; out = fw.update(0.1, { H2S: 0, CO: 0, O2: 20.9, LEL: 0 }, { inletBlocked: false, hoseLen: 0 }); }
  lcd.draw(out.lcd, t); device.setLeds(out.leds); device.setBacklight(out.backlight ? 1 : 0); device.update(0, { time: t });
  lcd.texture.needsUpdate = true;
  const g = new THREE.Group(); device.group.scale.setScalar(100); g.add(device.group);
  device.group.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = !/lcd/i.test(o.name); } });
  g.rotation.y = 0.32;
  return { root: g, dir: [-0.3, 0.32, 1], fov: 22, margin: 1.0 };
}

/* ---------- notebook com o app Inspeção SST e webcam ---------- */
async function buildLaptop() {
  const img = await loadImg('insp_app.jpg');
  const g = new THREE.Group();
  const alu = new THREE.MeshPhysicalMaterial({ color: 0x9ea3aa, metalness: 1, roughness: 0.36 });
  const glass = new THREE.MeshPhysicalMaterial({ color: 0x060607, roughness: 0.05, clearcoat: 1, clearcoatRoughness: 0.03 });
  const black = new THREE.MeshPhysicalMaterial({ color: 0x121315, roughness: 0.45, clearcoat: 0.4 });
  const LW = 15, LD = 10.2;
  // base com teclado e touchpad
  mesh(new RoundedBoxGeometry(LW, 0.5, LD, 8, 0.22), alu, 0, 0.25, 0, g);
  const kb = canvasTex(1500, 1020, (c, w, h) => {
    c.fillStyle = '#9ea3aa'; c.fillRect(0, 0, w, h);
    const kw = 86, kh = 80, gap = 12, x0 = 110, y0 = 90;
    for (let r = 0; r < 6; r++) for (let k = 0; k < 13; k++) {
      const hh = r === 0 ? 44 : kh; const y = y0 + (r === 0 ? 0 : 56 + (r - 1) * (kh + gap));
      rr(c, x0 + k * (kw + gap), y, kw, hh, 10); c.fillStyle = '#1a1c1f'; c.fill();
    }
    rr(c, w / 2 - 300, 650, 600, 330, 22); c.fillStyle = '#a7acb3'; c.fill(); c.strokeStyle = '#8e939a'; c.lineWidth = 3; c.stroke();
  });
  const top = mesh(new THREE.PlaneGeometry(LW - 0.4, LD - 0.4), new THREE.MeshPhysicalMaterial({ map: kb, metalness: 0.6, roughness: 0.4 }), 0, 0.505, 0, g);
  top.rotation.x = -Math.PI / 2;
  // tampa com a tela
  const lid = new THREE.Group(); lid.position.set(0, 0.5, -LD / 2 + 0.2); lid.rotation.x = -0.24; g.add(lid);
  const LH = 9.8;
  mesh(new RoundedBoxGeometry(LW, LH, 0.28, 8, 0.2), alu, 0, LH / 2, 0, lid);
  mesh(new RoundedBoxGeometry(LW - 0.1, LH - 0.1, 0.04, 8, 0.18), glass, 0, LH / 2, 0.15, lid);
  const SW = 14.0, SH = SW * 900 / 1440;
  const scr = canvasTex(1440, 900, (c, w, h) => { c.drawImage(img, 0, 0, w, h); });
  mesh(new THREE.PlaneGeometry(SW, SH), new THREE.MeshBasicMaterial({ map: scr, toneMapped: false }), 0, LH / 2 - 0.15, 0.175, lid).castShadow = false;
  // webcam presa no topo da tela
  const cam = new THREE.Group(); cam.position.set(0, LH + 0.42, 0.05); lid.add(cam);
  const bar = mesh(new THREE.CapsuleGeometry(0.5, 3.2, 12, 32), black, 0, 0, 0.25, cam); bar.rotation.z = Math.PI / 2;
  const lens = mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.12, 40), new THREE.MeshPhysicalMaterial({ color: 0x0a0c12, roughness: 0.05, clearcoat: 1, iridescence: 0.6 }), 0, 0, 0.72, cam); lens.rotation.x = Math.PI / 2;
  const ringL = mesh(new THREE.TorusGeometry(0.36, 0.05, 12, 40), new THREE.MeshPhysicalMaterial({ color: 0xd0d3d8, metalness: 1, roughness: 0.2 }), 0, 0, 0.74, cam);
  void ringL;
  mesh(new THREE.SphereGeometry(0.06, 12, 8), new THREE.MeshBasicMaterial({ color: 0x35d06a }), 0.95, 0, 0.7, cam);
  mesh(new RoundedBoxGeometry(1.4, 0.7, 0.9, 4, 0.12), black, 0, -0.55, -0.05, cam);
  g.rotation.y = -0.5;
  return { root: g, dir: [0.05, 0.42, 1], fov: 22, margin: 0.98 };
}

/* ---------- painel de comando: disjuntor + contator + relé térmico em trilho DIN ---------- */
async function buildPanel() {
  const g = new THREE.Group();
  const steel = new THREE.MeshPhysicalMaterial({ color: 0xc9cdd2, metalness: 1, roughness: 0.32 });
  const greyP = new THREE.MeshPhysicalMaterial({ color: 0x8e949b, roughness: 0.55, clearcoat: 0.15 });
  const darkP = new THREE.MeshPhysicalMaterial({ color: 0x3b4047, roughness: 0.5 });
  const whiteP = new THREE.MeshPhysicalMaterial({ color: 0xf1f1ee, roughness: 0.45, clearcoat: 0.2 });
  const screwM = new THREE.MeshPhysicalMaterial({ color: 0xd9dde1, metalness: 1, roughness: 0.25 });
  const face = (w, h, draw, mat = {}) => new THREE.MeshPhysicalMaterial({ map: canvasTex(w, h, draw), roughness: 0.45, clearcoat: 0.2, ...mat });
  const screw = (x, y, z, parent) => {
    const s1 = mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.12, 24), screwM, x, y, z, parent); s1.rotation.x = Math.PI / 2;
    mesh(new THREE.BoxGeometry(0.36, 0.06, 0.04), darkP, x, y, z + 0.07, parent);
    mesh(new THREE.BoxGeometry(0.06, 0.36, 0.04), darkP, x, y, z + 0.07, parent);
  };
  // trilho DIN 35 mm com furos
  const railTex = canvasTex(1600, 350, (c, w, h) => { c.fillStyle = '#cfd3d8'; c.fillRect(0, 0, w, h); c.fillStyle = '#2a2e33';
    for (let x = 60; x < w; x += 250) { rr(c, x, h / 2 - 32, 150, 64, 32); c.fill(); } });
  mesh(new THREE.BoxGeometry(17, 3.5, 0.15), new THREE.MeshPhysicalMaterial({ map: railTex, metalness: 1, roughness: 0.35 }), 0, 0, -0.5, g);
  mesh(new THREE.BoxGeometry(17, 0.15, 0.8), steel, 0, 1.68, -0.15, g); mesh(new THREE.BoxGeometry(17, 0.15, 0.8), steel, 0, -1.68, -0.15, g);

  // disjuntor tripolar (3 módulos)
  const br = new THREE.Group(); br.position.set(-5.2, 0, 0); g.add(br);
  mesh(new RoundedBoxGeometry(5.3, 9, 4.2, 4, 0.25), whiteP, 0, 0, 1.6, br);
  mesh(new RoundedBoxGeometry(5.3, 4.6, 1.8, 4, 0.25), whiteP, 0, 0, 3.9, br);
  const brF = face(530, 460, (c, w, h) => { c.fillStyle = '#f1f1ee'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#1d1d1f'; c.font = `800 52px ${FONT}`; c.textAlign = 'left'; c.fillText('C16', 28, 70);
    c.font = `600 26px ${FONT}`; c.fillStyle = '#555'; c.fillText('400V~  6000', 28, 108);
    c.fillStyle = '#d7141e'; c.font = `800 30px ${FONT}`; c.textAlign = 'right'; c.fillText('I-ON', w - 26, 66); c.fillStyle = '#1a9c4a'; c.fillText('O-OFF', w - 26, h - 26);
    c.strokeStyle = '#bbb'; c.lineWidth = 3; [w / 3, 2 * w / 3].forEach((x) => { c.beginPath(); c.moveTo(x, 130); c.lineTo(x, h - 70); c.stroke(); }); });
  mesh(new THREE.PlaneGeometry(5.3, 4.6), brF, 0, 0, 4.805, br);
  const lever = mesh(new RoundedBoxGeometry(4.6, 0.9, 1.6, 4, 0.2), new THREE.MeshPhysicalMaterial({ color: 0x24427a, roughness: 0.4, clearcoat: 0.4 }), 0, 0.45, 5.4, br);
  lever.rotation.x = -0.35;
  [-1.77, 0, 1.77].forEach((x) => { screw(x, 3.75, 3.73, br); screw(x, -3.75, 3.73, br); });

  // contator
  const ct = new THREE.Group(); ct.position.set(0.6, 0.6, 0); g.add(ct);
  mesh(new RoundedBoxGeometry(4.6, 8.4, 5.6, 4, 0.3), greyP, 0, 0, 2.3, ct);
  mesh(new RoundedBoxGeometry(4.2, 4.2, 1.6, 4, 0.3), greyP, 0, 0, 5.4, ct);
  const ctF = face(420, 420, (c, w, h) => { c.fillStyle = '#90969d'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#e9ecef'; c.font = `800 44px ${FONT}`; c.textAlign = 'center'; c.fillText('K1', w / 2, 60);
    rr(c, w / 2 - 70, 100, 140, 120, 14); c.fillStyle = '#20242a'; c.fill(); rr(c, w / 2 - 50, 118, 100, 84, 8); c.fillStyle = '#29b14a'; c.fill();
    c.fillStyle = '#f1f3f5'; c.font = `700 26px ${FONT}`; c.fillText('AC-3  9 A  4 kW', w / 2, 285); c.fillText('A1     A2', w / 2, 330);
    c.font = `600 22px ${FONT}`; c.fillStyle = '#d6dade'; c.fillText('220 V  60 Hz', w / 2, 372); });
  mesh(new THREE.PlaneGeometry(4.2, 4.2), ctF, 0, 0, 6.205, ct);
  // blocos de bornes com rótulos
  const lab = (txt) => face(460, 90, (c, w, h) => { c.fillStyle = '#5d636b'; c.fillRect(0, 0, w, h); c.fillStyle = '#f1f3f5'; c.font = `700 40px ${FONT}`; c.textAlign = 'center';
    txt.forEach((t, i) => c.fillText(t, w * (i + 0.5) / txt.length, 62)); });
  mesh(new THREE.PlaneGeometry(4.6, 0.9), lab(['1L1', '3L2', '5L3']), 0, 3.45, 5.11, ct);
  mesh(new THREE.PlaneGeometry(4.6, 0.9), lab(['2T1', '4T2', '6T3']), 0, -3.45, 5.11, ct);
  [-1.5, 0, 1.5].forEach((x) => { screw(x, 2.75, 5.12, ct); screw(x, -2.75, 5.12, ct); });
  // relé térmico acoplado embaixo
  const rt = new THREE.Group(); rt.position.set(0.6, -6.4, 0); g.add(rt);
  mesh(new RoundedBoxGeometry(4.6, 3.8, 5.2, 4, 0.3), greyP, 0, 0, 2.6, rt);
  const rtF = face(460, 380, (c, w, h) => { c.fillStyle = '#90969d'; c.fillRect(0, 0, w, h); c.fillStyle = '#f1f3f5'; c.font = `700 30px ${FONT}`; c.textAlign = 'center';
    c.fillText('95 96   97 98', w / 2, 46); c.font = `600 24px ${FONT}`; c.fillText('1,0 – 1,6 A', w * 0.36, h - 34); });
  mesh(new THREE.PlaneGeometry(4.6, 3.8), rtF, 0, 0, 5.205, rt);
  const dial = mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.35, 40), new THREE.MeshPhysicalMaterial({ color: 0x2f6fd6, roughness: 0.35, clearcoat: 0.6 }), -0.7, 0.1, 5.35, rt); dial.rotation.x = Math.PI / 2;
  mesh(new THREE.BoxGeometry(0.16, 1.1, 0.06), whiteP, -0.7, 0.1, 5.55, rt).rotation.z = -0.6;
  const rst = mesh(new THREE.CylinderGeometry(0.45, 0.45, 0.4, 32), new THREE.MeshPhysicalMaterial({ color: 0xd7141e, roughness: 0.35, clearcoat: 0.6 }), 1.25, 0.1, 5.4, rt); rst.rotation.x = Math.PI / 2;
  // fios: disjuntor (bornes de baixo) → por trás → bornes de cima do contator; saída do relé térmico para o motor
  const wcol = [0x16181b, 0x6b7078, 0x6b3b1f];
  const wm = wcol.map((c) => new THREE.MeshPhysicalMaterial({ color: c, roughness: 0.4, clearcoat: 0.6 }));
  [-1.77, 0, 1.77].forEach((x, i) => {
    const ax = -5.2 + x, bx = 0.6 + (i - 1) * 1.5;
    tubeAlong([new THREE.Vector3(ax, -3.75, 3.9), new THREE.Vector3(ax, -5.2, 4.3), new THREE.Vector3(ax + 0.4, -6.0, 1.2),
      new THREE.Vector3(-1.9, -4.5 + i * 0.3, 0.8), new THREE.Vector3(-1.9, 3.5, 0.8),
      new THREE.Vector3(bx, 6.4 + i * 0.25, 2.0), new THREE.Vector3(bx, 5.6, 4.6), new THREE.Vector3(bx, 3.6, 5.2)], 0.2, wm[i], g, 220);
  });
  [-1.5, 0, 1.5].forEach((x, i) => {
    const px = 0.6 + x;
    tubeAlong([new THREE.Vector3(px, -7.7, 4.6), new THREE.Vector3(px, -9.0, 4.9), new THREE.Vector3(px + (i - 1) * 0.6, -12.5, 4.4)], 0.18, wm[i], g, 60);
    screw(px, -7.55, 5.21, g);
  });
  g.rotation.set(0.04, 0.42, 0);
  return { root: g, dir: [0.05, 0.25, 1], fov: 22, margin: 1.0 };
}


/* ---------- dosímetro de ruído + calibrador (modelo real do dosimetria-twin, symlink ./dosi) ---------- */
async function buildDose() {
  const { buildDosimeter } = await import('./dosi/dosimeter.js');
  const { buildCalibrator } = await import('./dosi/calibrator.js');
  const { createFirmware } = await import('./dosi/firmware.js');
  const fake = { THREE, scene: new THREE.Scene(), camera: null, canvas: document.createElement('canvas'), renderer, onFrame() { return () => {}; } };
  fake.scene.environment = scene.environment;
  const fw = createFirmware({ getInput: () => ({ L: 87.3, spectrum: [80, 82, 84, 85, 83, 82, 80, 75], calibrator: { coupled: false, on: false, level: 114 }, calDrift: 0 }) });
  fw.quickStart?.(); for (let i = 0; i < 60; i++) { fw.setClock?.(9 * 3600 + 1800 + i); fw.feed?.(88 + Math.sin(i) * 2, 60, 9 * 3600 + 1800 + i * 60); fw.update(0.1); }
  const d = buildDosimeter(fake, fw, null); d.setWindscreen?.(true);
  const c = buildCalibrator(fake, null); c.setLevel?.(114); c.setOn?.(true);
  for (let i = 0; i < 30; i++) { d.update?.(0.1, i * 0.1); c.update?.(0.1, i * 0.1); }
  const g = new THREE.Group();
  d.group.removeFromParent(); c.group.removeFromParent();
  d.group.position.set(0, 0, 0); d.group.rotation.set(0, 0, 0);
  c.group.position.set(0.085, -0.03, -0.02); c.group.rotation.set(0, -0.25, 0);
  g.add(d.group, c.group); g.scale.setScalar(100);
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  g.rotation.y = 0.18;
  return { root: g, dir: [-0.15, 0.12, 1], fov: 22, margin: 1.0 };
}

/* ---------- monta, enquadra e renderiza ---------- */
const BUILD = { lock: buildLock, lux: buildLux, gas: buildGas, laptop: buildLaptop, panel: buildPanel, dose: buildDose };
try {
  await document.fonts.ready;
  const { root, dir, fov, margin } = await BUILD[ITEM]();
  scene.add(root); root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root), sph = box.getBoundingSphere(new THREE.Sphere());
  const cam = new THREE.PerspectiveCamera(fov, 1, 0.1, 1000);
  const d = new THREE.Vector3(...dir).normalize();
  const dist = sph.radius / Math.sin(THREE.MathUtils.degToRad(fov / 2)) * margin;
  cam.position.copy(sph.center).addScaledVector(d, dist); cam.lookAt(sph.center);
  // luz-chave acompanha o objeto
  key.target.position.copy(sph.center); key.position.copy(sph.center).add(new THREE.Vector3(-4, 7, 6).multiplyScalar(sph.radius / 3));
  const sc = key.shadow.camera; sc.left = sc.bottom = -sph.radius * 1.3; sc.right = sc.top = sph.radius * 1.3; sc.near = 0.1; sc.far = sph.radius * 8; sc.updateProjectionMatrix();
  renderer.render(scene, cam); renderer.render(scene, cam);
  // recorta rente ao objeto (pelo canal alfa), com folga de 2 %
  const src = renderer.domElement, c2 = document.createElement('canvas'); c2.width = SIZE; c2.height = SIZE;
  const x2 = c2.getContext('2d'); x2.drawImage(src, 0, 0);
  const px = x2.getImageData(0, 0, SIZE, SIZE).data; let x0 = SIZE, y0 = SIZE, x1 = 0, y1 = 0;
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) if (px[(y * SIZE + x) * 4 + 3] > 8) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const pad = Math.round(SIZE * 0.02); x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(SIZE - 1, x1 + pad); y1 = Math.min(SIZE - 1, y1 + pad);
  const out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(c2, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  window.__png = out.toDataURL('image/png');
  window.__done = true;
} catch (e) { window.__err = String(e && e.stack || e); window.__done = true; console.error(e); }
